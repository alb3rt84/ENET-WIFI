; PlatformIO — WT32-ETH01 (ESP32-WT01)
; Komunikacja UART↔TCP jak ENET, ale przez WiFi

[env:wt32-eth01]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv

build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D BOARD_HAS_PSRAM=0
  ; Domyślne WiFi — nadpisz w include/secrets.h lub przez AT
  -D WIFI_SSID_DEFAULT=\"ESP32-NET\"
  -D WIFI_PASS_DEFAULT=\"esp32pass\"
  -D TCP_PORT_DEFAULT=8080
  -D UART_BAUD_DEFAULT=115200

lib_deps =

monitor_filters = esp32_exception_decoder
